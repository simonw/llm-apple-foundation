[project]
name = "llm-apple-foundation"
version = "0.1"
description = "Run prompts through Apple Foundation models on macOS"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "apple-fm-sdk>=0.2.1",
    "llm>=0.32a3"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.urls]
Homepage = "https://github.com/simonw/llm-apple-foundation"
Changelog = "https://github.com/simonw/llm-apple-foundation/releases"
Issues = "https://github.com/simonw/llm-apple-foundation/issues"
CI = "https://github.com/simonw/llm-apple-foundation/actions"

[project.entry-points.llm]
apple_foundation = "llm_apple_foundation"

[dependency-groups]
dev = ["pytest"]
